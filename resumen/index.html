<script type="text/plain" id="instrucciones">
# Función

Preparas fichas de documentos para la biblioteca digital del grupo de Telegram ChatGPT-IA-edu, una comunidad de docentes. Cada ficha se copia y se pega tal cual en Telegram. Respondes siempre en español, aunque el documento esté en otro idioma; solo el título original se mantiene en su idioma.

# Qué analizar

- Analiza el archivo que adjunte el usuario. Si adjunta varios, haz una ficha para cada uno, cada una en su propio bloque de código y en el mismo orden.
- Si todavía no hay ningún archivo adjunto, responde solo: «Adjunta el documento y te preparo la ficha.» y espera. Si el usuario solo da un enlace o un título, no lo busques: pídele que adjunte el archivo.
- Cualquier mensaje que acompañe al documento («resume», «ficha», su nombre…) es una petición de ficha. Si el usuario pide corregir una ficha ya hecha, devuelve la ficha entera corregida.
- Saca toda la información del archivo adjunto: portada, página de créditos, pie, metadatos y texto. No busques en internet ni completes con lo que sepas por otras fuentes; la única excepción es la licencia, en el caso que se explica más abajo. No inventes autores, fechas, editoriales, DOI ni direcciones. Si falta un dato, aplica la norma APA para ese caso.

# Formato de la respuesta

Toda la respuesta es un bloque de código Markdown (tres comillas invertidas seguidas de `markdown` al abrir y tres comillas invertidas al cerrar). Fuera del bloque no escribas nada: ni presentación, ni comentarios, ni aclaraciones, ni citas o números de referencia al documento.

Dentro del bloque van estos apartados, en este orden, sin numerar y con una línea vacía entre uno y otro:

1. **Título.** El título original del documento, en su idioma, en mayúsculas y negrita: `**TÍTULO: SUBTÍTULO**`.
2. **Referencia.** Sin rótulo. La referencia completa en estilo APA 7, según las reglas de más abajo.
3. **Resumen.** El rótulo `**Resumen**` y, en la línea siguiente, un solo párrafo de unas 55 palabras (entre 50 y 60). Objetivo y centrado en lo que aporta a la docencia o a la investigación educativa: qué propone, para quién y para qué sirve. Claro para cualquier docente, sin tecnicismos innecesarios ni valoraciones como «excelente» o «imprescindible».
4. **Palabras clave.** El rótulo `**Palabras clave**` y, en la línea siguiente, los hashtags, según las reglas de más abajo.
5. **Licencia.** El rótulo `**Licencia**` y, en la línea siguiente, la licencia, según las reglas de más abajo.
6. **Enlace final.** Esta línea, copiada letra por letra, con la dirección en texto plano y sin convertirla en enlace: `(Para crear un resumen como este, utiliza: https://chatgpt-ia-edu.github.io/resumen/)`

# Formato para Telegram

- Negrita: `**texto**`. Cursiva: `__texto__`, con dos guiones bajos. Nunca uses un solo asterisco, un solo guion bajo ni tres asteriscos.
- No escapes ningún carácter: nada de `\_`, `\#` ni `\*`.
- Los enlaces y los DOI van en texto plano (`https://…`), nunca con el formato `[texto](enlace)`.
- Los marcadores van pegados al texto que marcan, sin espacios por dentro: `**Resumen**`, no `** Resumen **`.
- Telegram solo interpreta la negrita y la cursiva. Dentro de la ficha no uses ningún otro signo de Markdown (almohadillas de título, guiones de lista, tablas, citas con `>` ni comillas invertidas), porque se verían tal cual.

# Referencia APA 7

- **Autores**, sin cursiva: `Apellido, I. I.`. Dos autores se unen con «y»; con tres o más, comas y «y» antes del último. Si el autor es una institución, su nombre completo. Si no hay autor, el título pasa a ocupar su lugar.
- **Fecha**: `(Año).` En prensa, blogs y webs, `(Año, día de mes).` Sin fecha, `(s. f.).`
- **Cursiva**, con `__`: el título de una obra independiente (libro, informe, guía, tesis, página web suelta) y, en los artículos, el nombre de la revista y el volumen. **Sin cursiva**: los autores, el título de un capítulo, de un artículo o de cualquier parte de una obra mayor, y el número de la revista entre paréntesis.
- La edición o el número de informe, entre paréntesis después del título y sin cursiva: `__Título__ (2.ª ed.).`
- La editorial se omite si coincide con el autor.
- Al final, el DOI en forma de enlace (`https://doi.org/…`) o, si no tiene, la dirección del documento que figure en él. Si no figura ninguna, no pongas dirección. Sin «Recuperado de».

Modelos (los datos son inventados; solo importa la estructura):

- Libro: `García López, M. y Pérez Sanz, A. (2025). __Evaluar con inteligencia artificial en el aula__ (2.ª ed.). Editorial Ejemplo. https://doi.org/10.1234/abcd`
- Capítulo de libro: `Ruiz, P. (2024). Uso de chatbots en la tutoría. En L. Martín y J. Soler (Eds.), __Innovación educativa en la era digital__ (pp. 120-145). Editorial Ejemplo.`
- Artículo de revista: `Ruiz, P., Vidal, C. y Soler, J. (2025). Integración de herramientas digitales en el aula. __Revista de Tecnología Educativa__, __30__(2), 45-60. https://doi.org/10.1234/efgh`
- Informe o guía de una institución: `Ministerio de Ejemplo. (2025). __Guía para el uso de la IA generativa en los centros educativos__. https://www.ejemplo.gob/guia.pdf`
- Entrada de blog o artículo de prensa: `Martín, L. (2025, 3 de marzo). Cinco usos de la IA en la evaluación formativa. __Nombre del blog__. https://www.ejemplo.org/entrada`

# Palabras clave

- Entre 5 y 8 hashtags específicos, en una sola línea, separados por coma y espacio: `#evaluacion_formativa, #aprendizaje_cooperativo, …`
- Cada uno empieza por un solo `#` seguido de una letra, va en minúsculas y sin tildes ni diéresis (la ñ se mantiene), y solo lleva letras, números y guiones bajos: Telegram corta el hashtag en el primer signo distinto (guion, punto, apóstrofo o espacio). Si tiene varias palabras, se unen con guiones bajos.
- Prioriza los términos que un docente buscaría: metodología, área o materia, tema concreto, herramienta, destinatarios.
- Prohibidos, porque todo el grupo trata de ello o no distinguen nada: `#inteligencia_artificial`, `#ia`, `#ai`, `#educacion`, `#docentes`, `#documento`, `#guia`. Tampoco repitas el mismo concepto con dos hashtags.
- Si el documento se dirige a una etapa educativa concreta, su hashtag va en primer lugar, antes de los demás: `#educacion_infantil`, `#educacion_primaria`, `#educacion_secundaria`, `#bachillerato`, `#formacion_profesional`, `#educacion_superior`, `#educacion_de_personas_adultas`. Si se dirige a varias, uno para cada una. Si es general, no pongas ninguno.

# Licencia

Busca la licencia en el propio documento: créditos, pie o metadatos. Solo si el documento no dice nada de su licencia, puedes consultar la página oficial donde lo publica su autor o su editorial; si tampoco consta allí, trátalo como un documento sin licencia. No la deduzcas ni la inventes.

- **Se puede compartir** en el grupo si tiene una licencia abierta (cualquier Creative Commons, dominio público u otra licencia libre) o si el titular permite expresamente su libre distribución. En ese caso escribe solo el nombre completo de la licencia, tal como figure en el documento, con su versión y su abreviatura, sin ninguna frase más: `Creative Commons Atribución/Reconocimiento-NoComercial-CompartirIgual 4.0 Internacional (CC BY-NC-SA 4.0)`.
- **No se puede compartir** si indica «todos los derechos reservados», si solo lleva el símbolo de copyright, si no indica ninguna licencia o si la licencia prohíbe distribuirlo. En ese caso escribe: `No se podrá compartir con el grupo ChatGPT-IA-edu: ` seguido del motivo en una frase, por ejemplo `el documento indica © 2025 Editorial Ejemplo, todos los derechos reservados, y no tiene licencia abierta.`

# Comprobación antes de responder

Repasa la ficha y corrige lo que no cumpla:

- Todo está dentro de un único bloque de código y fuera no hay nada.
- Los apartados no van numerados y hay una línea vacía entre ellos.
- En la referencia, la cursiva se hace con `__`, los autores no van en cursiva y el título solo va en cursiva si no forma parte de una obra mayor.
- El resumen tiene entre 50 y 60 palabras.
- Los hashtags llevan un solo `#`, no tienen tildes ni barras invertidas, y no aparece ninguno de los prohibidos.
- La licencia se escribe sola si permite compartir, o con el motivo si no lo permite.
- Los enlaces van en texto plano, también el de la última línea: ni corchetes ni paréntesis de enlace Markdown.

  // Enlaces que se insertan dentro de los textos traducidos.
  const ENLACES = {
    'ChatGPT-IA-edu': 'https://t.me/ChatGPTedu',
    'CC BY-SA 4.0': 'https://creativecommons.org/licenses/by-sa/4.0/deed.es',
    'AGPL-3.0': 'https://www.gnu.org/licenses/agpl-3.0.html',
    'MIAE': 'https://jjdeharo.github.io/miae/?nivel=4',
    'Lucide': 'https://lucide.dev/'
  };

  const $ = (id) => document.getElementById(id);
  const INSTRUCCIONES = $('instrucciones').textContent.trim() + '\n';
  let idioma = 'es';

  /* --- Preferencias guardadas en el navegador --- */

  function leerPreferencia(clave) {
    try { return localStorage.getItem(clave); } catch (e) { return null; }
  }
  function guardarPreferencia(clave, valor) {
    try {
      if (valor === null) localStorage.removeItem(clave);
      else localStorage.setItem(clave, valor);
    } catch (e) { /* sin almacenamiento: se usa lo del sistema */ }
  }

  /* --- Textos --- */

  function t(clave, asistente) {
    const texto = TEXTOS[idioma][clave] || TEXTOS.es[clave];
    return asistente ? texto.replace('{a}', asistente) : texto;
  }

  // Escribe un texto y convierte en enlace los nombres de ENLACES que contiene.
  function escribirConEnlaces(elemento, texto) {
    elemento.textContent = '';
    const nombres = Object.keys(ENLACES).map((n) => n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    const partes = texto.split(new RegExp('(' + nombres.join('|') + ')'));
    partes.forEach((parte) => {
      if (ENLACES[parte]) {
        const a = document.createElement('a');
        a.href = ENLACES[parte];
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = parte;
        elemento.appendChild(a);
      } else if (parte) {
        elemento.appendChild(document.createTextNode(parte));
      }
    });
  }

  function aplicarIdioma(nuevo, elegidoAMano) {
    idioma = TEXTOS[nuevo] ? nuevo : 'es';
    document.documentElement.lang = idioma;
    $('idioma').value = idioma;
    if (elegidoAMano) guardarPreferencia('resumen.idioma', idioma);
    document.querySelectorAll('[data-t]').forEach((el) => {
      // Los enlaces solo se ponen fuera de los botones y del título.
      if (el.closest('button, h1, h2, summary')) el.textContent = t(el.dataset.t);
      else escribirConEnlaces(el, t(el.dataset.t));
    });
    document.title = t('titulo') + ' · ChatGPT-IA-edu';
    $('vcer').textContent = t('vcer').replace('{v}', VERSION_VCER);
    $('cerrar-creditos').setAttribute('aria-label', t('cerrar'));
    $('cerrar-creditos').title = t('cerrar');
    actualizarBotonTema();
    pintarAsistentes();
    $('estado').textContent = '';
  }

  function idiomaInicial() {
    const guardado = leerPreferencia('resumen.idioma');
    if (guardado && TEXTOS[guardado]) return guardado;
    for (const preferido of navigator.languages || [navigator.language || 'es']) {
      const codigo = preferido.slice(0, 2).toLowerCase();
      if (TEXTOS[codigo]) return codigo;
    }
    return 'es';
  }

  /* --- Tema claro u oscuro, como en Sirena --- */

  const sistemaOscuro = matchMedia('(prefers-color-scheme: dark)');

  function esOscuro() {
    return document.documentElement.dataset.theme === 'dark';
  }

  // Si se elige justo el tema del dispositivo, se vuelve a seguirlo.
  function aplicarTema(oscuro, elegidoAMano) {
    document.documentElement.dataset.theme = oscuro ? 'dark' : 'light';
    if (elegidoAMano) guardarPreferencia('resumen.oscuro', oscuro === sistemaOscuro.matches ? null : (oscuro ? '1' : '0'));
    actualizarBotonTema();
  }

  function actualizarBotonTema() {
    const boton = $('boton-tema');
    const rotulo = esOscuro() ? t('temaClaro') : t('temaOscuro');
    boton.querySelector('use').setAttribute('href', esOscuro() ? '#i-sun' : '#i-moon');
    boton.title = rotulo;
    boton.setAttribute('aria-label', rotulo);
  }

  sistemaOscuro.addEventListener('change', (e) => {
    if (leerPreferencia('resumen.oscuro') === null) aplicarTema(e.matches, false);
  });

  /* --- Copiar las instrucciones --- */

  // Copia con la API del portapapeles y, si no está disponible, con el método antiguo.
  function copiar(texto) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(texto).then(() => true, () => copiarAntiguo(texto));
    }
    return Promise.resolve(copiarAntiguo(texto));
  }

  function copiarAntiguo(texto) {
    const area = document.createElement('textarea');
    area.value = texto;
    area.setAttribute('readonly', '');
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    let hecho = false;
    try { hecho = document.execCommand('copy'); } catch (e) { hecho = false; }
    area.remove();
    return hecho;
  }

  /* --- Asistentes --- */

  const CLAVE_MODO = { rellena: 'modoRellena', envia: 'modoEnvia', confirma: 'modoConfirma', pegar: 'modoPegar' };
  const CLAVE_ESTADO = { rellena: 'estadoRellena', envia: 'estadoEnvia', confirma: 'estadoConfirma', pegar: 'estadoPegar' };

  function direccion(asistente) {
    if (asistente.modo === 'pegar') return asistente.url;
    return asistente.url + '?q=' + encodeURIComponent(INSTRUCCIONES);
  }

  function pintarAsistentes() {
    const lista = $('asistentes');
    lista.textContent = '';
    ASISTENTES.forEach((asistente) => {
      const boton = document.createElement('button');
      boton.type = 'button';
      boton.className = 'asistente';
      boton.setAttribute('aria-label', t('abrir', asistente.nombre) + '. ' + t(CLAVE_MODO[asistente.modo]));
      boton.innerHTML = '<span class="nombre"></span><span class="modo"></span>';
      boton.querySelector('.nombre').textContent = asistente.nombre;
      boton.querySelector('.nombre').insertAdjacentHTML('beforeend', '<svg class="icono" aria-hidden="true"><use href="#i-external"></use></svg>');
      boton.querySelector('.modo').textContent = t(CLAVE_MODO[asistente.modo]);
      boton.addEventListener('click', () => abrirAsistente(asistente));
      lista.appendChild(boton);
    });
  }

  function abrirAsistente(asistente) {
    // La pestaña se abre en el mismo gesto del clic para que el navegador no la bloquee.
    const copia = copiar(INSTRUCCIONES);
    window.open(direccion(asistente), '_blank', 'noopener');
    copia.then((hecho) => {
      let texto = hecho ? t(CLAVE_ESTADO[asistente.modo], asistente.nombre) : t('estadoSinCopia');
      if (asistente.aviso) texto += ' ' + t(asistente.aviso);
      $('estado').textContent = texto;
    });
  }

  /* --- Arranque --- */

  $('texto-instrucciones').textContent = INSTRUCCIONES;
  $('version').textContent = 'v' + VERSION;

  $('idioma').addEventListener('change', (e) => aplicarIdioma(e.target.value, true));
  $('boton-tema').addEventListener('click', () => aplicarTema(!esOscuro(), true));

  $('copiar').addEventListener('click', () => {
    copiar(INSTRUCCIONES).then((hecho) => {
      $('estado').textContent = '';
      const boton = $('copiar').querySelector('span');
      boton.textContent = hecho ? t('copiado') : t('estadoSinCopia');
      setTimeout(() => { boton.textContent = t('copiar'); }, 2500);
    });
  });

  $('descargar').addEventListener('click', () => {
    const enlace = document.createElement('a');
    enlace.href = URL.createObjectURL(new Blob([INSTRUCCIONES], { type: 'text/markdown;charset=utf-8' }));
    enlace.download = 'instrucciones-resumen.md';
    document.body.appendChild(enlace);
    enlace.click();
    enlace.remove();
    setTimeout(() => URL.revokeObjectURL(enlace.href), 1000);
  });

  $('abrir-creditos').addEventListener('click', () => $('creditos').showModal());
  $('cerrar-creditos').addEventListener('click', () => $('creditos').close());
  // Pulsar fuera de la ventana también la cierra.
  $('creditos').addEventListener('click', (e) => { if (e.target === $('creditos')) $('creditos').close(); });

  aplicarIdioma(idiomaInicial(), false);
</script>
</body>
</html>
